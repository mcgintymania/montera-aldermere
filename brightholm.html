<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Montera">
<title>Montera: The Rising Light of Brightholm</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: radial-gradient(ellipse at 50% -10%, #23307a 0%, #121735 45%, #0d0f17 80%) fixed, #0d0f17; color: #f8f0dc; }
body { font-family: ui-monospace, "Cascadia Mono", Consolas, "Lucida Console", "Courier New", monospace; font-weight: 700; }
main { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 24px); display: flex; flex-direction: column; gap: 18px; text-align: center; }
img { width: 100%; height: auto; filter: drop-shadow(0 6px 18px rgba(0, 0, 0, .55)); }
h1 { color: #f2c230; font-size: 21px; text-shadow: 0 2px 0 #5a2a08; }
p { color: #a9b1d6; font-size: 14px; line-height: 1.5; }
a { align-self: center; font-size: 14px; color: #0d0f17; background: #f2c230; border-radius: 10px; padding: 10px 18px; text-decoration: none; box-shadow: 0 3px 0 #e8892a; }
</style>
</head>
<body>
<main>
  <img src="logo.webp" alt="Montera">
  <h1>The Rising Light of Brightholm</h1>
  <p id="msg">Brightholm is being built. New parts will appear here as they are ready.</p>
  <a href="./">Back to Montera</a>
</main>
<script>
'use strict';
try {
  if (localStorage.getItem('mtb_tester') !== '1' && localStorage.getItem('mtb_unlocked') !== '1') document.getElementById('msg').textContent = 'This adventure is not open yet.';
} catch { /* storage unavailable */ }
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
</script>
</body>
</html>
